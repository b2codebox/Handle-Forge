<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handle Forge — email name generator</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <h1>Email name generator</h1>

      <section class="panel" aria-labelledby="result-label">
        <p id="result-label" class="label">Your name</p>

        <div class="result" id="result" aria-live="polite">
          <span class="result-text" id="handle">gardenkeeper05</span>

          <div class="result-actions">
            <button class="act" id="copy" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="9" width="11" height="11" rx="2" />
                <path d="M5 15V5a2 2 0 0 1 2-2h10" />
              </svg>
              <span id="copy-label" data-label="Copy">Copy</span>
            </button>

            <button
              class="act like"
              id="like"
              type="button"
              aria-pressed="false"
              aria-label="Make a family of 25 names from this one"
              title="Family of 25"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20s-7-4.6-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.4-7 9-7 9z" />
              </svg>
            </button>

          </div>
        </div>

        <div class="meta">
          <span id="length">14 characters</span>
          <span class="dot" aria-hidden="true">•</span>
          <span id="number">number 05</span>
        </div>

        <div class="extend">
          <select id="domain" class="act" aria-label="Email extension">
            <option value="@outlook.com">@outlook.com</option>
            <option value="@gmail.com">@gmail.com</option>
            <option value="@protonmail.com">@protonmail.com</option>
          </select>
          <button class="act" id="extend" type="button" aria-pressed="false">Add extension</button>
        </div>

        <button class="primary" id="generate" type="button">
          Generate another
          <kbd>Space</kbd>
        </button>
      </section>

      <a
        class="act outlook"
        href="https://signup.live.com/signup"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open the Outlook sign-up page in a new tab"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="3" />
          <path d="M4.2 7.2 12 12.8l7.8-5.6" />
        </svg>
        Outlook sign-up
        <svg class="ext" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 17 17 7" />
          <path d="M9.5 7H17v7.5" />
        </svg>
      </a>

      <section class="recent" id="recent-box" aria-labelledby="recent-label">
        <div class="recent-head">
          <h2 id="recent-label">Recent</h2>
          <button class="ghost" id="clear" type="button">Clear</button>
        </div>
        <ul class="chips" id="recent"></ul>
      </section>

      <section class="recent" id="family-box" aria-labelledby="family-label" hidden>
        <div class="recent-head">
          <h2 id="family-label">Family</h2>
          <div class="tools">
            <button class="ghost" id="copyall" type="button">
              <span id="copyall-label" data-label="Copy all">Copy all</span>
            </button>
            <button class="ghost" id="export" type="button">Export .txt</button>
          </div>
        </div>
        <ul class="chips" id="family"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
